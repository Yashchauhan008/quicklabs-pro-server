services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    image: yashchauhan008/quicklabs-backend:latest
    platform: linux/amd64
    container_name: quicklabs-backend
    env_file:
      - ./.env.prod
    ports:
      - '3003:3003'
    volumes:
      - ${PWD}/logs:/app/logs
      - ${PWD}/uploads:/app/uploads
    command: >
      sh -c "dbmate up && npm run start"
